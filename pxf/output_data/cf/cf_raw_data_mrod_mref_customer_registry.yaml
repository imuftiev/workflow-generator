schema_version: 2.0
metadata:
    author: inmuftiev@vtb.ru
    version: "1.0"
    description: Управляющий поток для загрузки МРОД
    tags:
      - 'team: IRDG'
      - 'cf:cf_raw_data_mrod_mref_customer_registry'
      - 'area: dm_rawd'
      - 'src: MROD'
      - 'tgt: rawd'
    group: dm_rawd
    imports:
      - rdv_cf_mrod_template_rawd.cf_mrod_template

flows:
  - id: cf_raw_data_mrod_mref_customer_registry
    description: Управляющий поток для МРОД
    builder: ceh_core_idl.app.builders.simple_flow_builder
    metadata:
      - name: wf_name_increment
        default: wf_raw_data_mrod_mref_customer_registry
      - name: wf_name_init
        default: wf_raw_data_mrod_mref_customer_registry_init
      - name: algos_map
        default: mrod_mref_customer_registry
      - name: source_resource_names
        default: tseh.public.mrod_mref_customer_registry
      - name: target_resource_name
        default: ceh.rd_rawd.mrod_mref_customer_registry
    tasks:
      - id: run_wf
        builder: ceh_core_idl.app.builders.include_flow_builder
        properties:
          ref: cf_mrod_template
          properties:
            mode: ANY
            work_flow_id: ${wf_name_increment}
            init_work_flow_id: ${wf_name_init}
            wf_metric: wf_max_date_to
            cf_metric: wf_max_date_to
            init_metric: src_init_load_date
            default_value: "1899-12-31T23:59:59"
            actual_dttm_prefix: 'tseh'
            algos_map:
              mrod_mref_customer_registry:
                - ceh: ${target_resource_name}
                  uni: ${source_resource_names}